<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Der Weg einer Sichtung in fünf Schritten: Kamera schaut zu, etwas bewegt sich, der Chip schaut nach, die Art bekommt einen Namen, du bekommst Bescheid.">
  <!-- Bewusst ohne Fachbegriffe: RTSP, Inferenz, Confirmer und
       Event-JSON stehen in der Technik-Seite. Hier steht der Weg, den
       ein Eichhörnchen nimmt, bis es auf dem Handy ankommt. -->
  <rect width="1200" height="300" rx="18" fill="#141414"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <!-- Verbindungslinie hinter den Karten -->
    <path d="M116 112 H1084" stroke="#2a2a2a" stroke-width="2" stroke-dasharray="4 8"/>

    <!-- 1 · Kamera -->
    <g transform="translate(20,44)">
      <rect width="192" height="200" rx="16" fill="#1a1a1a"/>
      <circle cx="96" cy="68" r="34" fill="#a8a8a8" fill-opacity="0.14"/>
      <g transform="translate(78,50) scale(1.5)" fill="none" stroke="#c3c9d0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13" r="3.5"/>
      </g>
      <text x="96" y="132" fill="#7b848e" font-size="11" font-weight="700" text-anchor="middle">SCHRITT 1</text>
      <text x="96" y="156" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Kamera schaut zu</text>
      <text x="96" y="180" fill="#9ba3ad" font-size="12" text-anchor="middle">Deine eigene Kamera,</text>
      <text x="96" y="196" fill="#9ba3ad" font-size="12" text-anchor="middle">im eigenen Netz.</text>
    </g>

    <!-- 2 · Bewegung -->
    <g transform="translate(262,44)">
      <rect width="192" height="200" rx="16" fill="#1a1a1a"/>
      <circle cx="96" cy="68" r="34" fill="#cbd5e1" fill-opacity="0.14"/>
      <g transform="translate(78,50) scale(1.5)">
        <path d="M1 12 C4 5 7 5 9 12 C11 19 14 19 16 12 C18 5 21 5 23 12" stroke="#cbd5e1" stroke-width="2.1" stroke-linecap="round" fill="none"/>
      </g>
      <text x="96" y="132" fill="#7b848e" font-size="11" font-weight="700" text-anchor="middle">SCHRITT 2</text>
      <text x="96" y="156" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Etwas bewegt sich</text>
      <text x="96" y="180" fill="#9ba3ad" font-size="12" text-anchor="middle">Wind und Schatten</text>
      <text x="96" y="196" fill="#9ba3ad" font-size="12" text-anchor="middle">fliegen vorher raus.</text>
    </g>

    <!-- 3 · Chip -->
    <g transform="translate(504,44)">
      <rect width="192" height="200" rx="16" fill="#1a1a1a"/>
      <circle cx="96" cy="68" r="34" fill="#f472b6" fill-opacity="0.14"/>
      <g transform="translate(76,48)" fill="none" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="7" y="7" width="26" height="26" rx="5"/>
        <rect x="15" y="15" width="10" height="10" rx="2" fill="#f472b6" stroke="none"/>
        <path d="M14 7V2M26 7V2M14 33v5M26 33v5M7 14H2M7 26H2M33 14h5M33 26h5"/>
      </g>
      <text x="96" y="132" fill="#7b848e" font-size="11" font-weight="700" text-anchor="middle">SCHRITT 3</text>
      <text x="96" y="156" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Der Chip schaut nach</text>
      <text x="96" y="180" fill="#9ba3ad" font-size="12" text-anchor="middle">Tier? Mensch? Auto?</text>
      <text x="96" y="196" fill="#9ba3ad" font-size="12" text-anchor="middle">In wenigen Millisekunden.</text>
    </g>

    <!-- 4 · Art -->
    <g transform="translate(746,44)">
      <rect width="192" height="200" rx="16" fill="#1a1a1a"/>
      <circle cx="96" cy="68" r="34" fill="#62d26f" fill-opacity="0.14"/>
      <g transform="translate(75,47) scale(1.75)">
        <ellipse cx="13" cy="13.5" rx="5.8" ry="5" fill="#62d26f"/><circle cx="5.5" cy="8.5" r="3.3" fill="#62d26f"/><path d="M 4 10 Q 6 11.5, 9 12.5 L 9 14 Q 5.5 14.5, 4 11.5 Z" fill="#62d26f"/><path d="M 2.5 8.5 L -0.3 9.3 L 3 10.5 Z" fill="#f59e0b"/><circle cx="5" cy="8" r="0.6" fill="#0e1217"/><circle cx="5.18" cy="7.82" r="0.2" fill="#fff"/><path d="M 18.5 15 L 22 18 L 18 17 Z" fill="#62d26f"/><path d="M 10 18 Q 9 19.5, 9.5 21.5" stroke="#62d26f" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="M 13.5 18 Q 14 19.5, 13 21.5" stroke="#62d26f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </g>
      <text x="96" y="132" fill="#7b848e" font-size="11" font-weight="700" text-anchor="middle">SCHRITT 4</text>
      <text x="96" y="156" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Die Art bekommt</text>
      <text x="96" y="174" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">einen Namen</text>
      <text x="96" y="196" fill="#9ba3ad" font-size="12" text-anchor="middle">Nicht „Vogel“ — „Blaumeise“.</text>
    </g>

    <!-- 5 · Meldung -->
    <g transform="translate(988,44)">
      <rect width="192" height="200" rx="16" fill="#1a1a1a"/>
      <circle cx="96" cy="68" r="34" fill="#fbbf24" fill-opacity="0.14"/>
      <g transform="translate(72,44) scale(2)" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 L11 13"/><path d="M22 2 L15 22 L11 13 L2 9 Z"/>
      </g>
      <text x="96" y="132" fill="#7b848e" font-size="11" font-weight="700" text-anchor="middle">SCHRITT 5</text>
      <text x="96" y="156" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Du bekommst</text>
      <text x="96" y="174" fill="#edf4fb" font-size="15" font-weight="700" text-anchor="middle">Bescheid</text>
      <text x="96" y="196" fill="#9ba3ad" font-size="12" text-anchor="middle">Im Chat und in der Mediathek.</text>
    </g>

    <!-- Pfeilspitzen -->
    <g fill="#3a3a3a">
      <polygon points="228,106 244,112 228,118"/>
      <polygon points="470,106 486,112 470,118"/>
      <polygon points="712,106 728,112 712,118"/>
      <polygon points="954,106 970,112 954,118"/>
    </g>

    <text x="600" y="278" fill="#7b848e" font-size="12.5" text-anchor="middle">Schritt 3 ist mit einem Coral-USB-Stick am schnellsten — ohne ihn rechnet der Prozessor mit, nur langsamer.</text>
  </g>
</svg>
