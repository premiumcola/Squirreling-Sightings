      <rect x="520" y="38" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="520" y="38" width="300" height="7" rx="3.5" fill="#7faec9"/>
      <text x="848" y="46" fill="#cfe3ee" font-size="13" font-weight="700">96 % Blitzpotential</text>
