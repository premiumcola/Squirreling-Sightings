<section id="logs" class="panel section" data-dock-section="settings">
  <div class="section-head">
    <h3>System-Logs</h3>
    <div style="display: flex; gap: 8px; align-items: center">
      <select id="logLevelFilter" class="log-level-select">
        <option value="DEBUG">DEBUG</option>
        <option value="INFO" selected>INFO</option>
        <option value="WARNING">WARNING</option>
        <option value="ERROR">ERROR</option>
      </select>
      <select id="logSubsystemFilter" class="log-level-select">
        <option value="">All</option>
        <option value="camera_runtime">Cams</option>
        <option value="camera_runtime.timelapse">Timelapse</option>
        <option value="storage">Mediathek</option>
        <option value="telegram">Telegram</option>
        <option value="mqtt">MQTT</option>
        <option value="detector">Coral / KI</option>
        <option value="discovery">Discovery</option>
        <option value="server">Server</option>
      </select>
      <span class="log-live" title="Aktualisiert sich alle 5 s, solange das Panel sichtbar ist"
        >live</span
      >
      <button
        id="logCopyBtn"
        class="btn-action action-green"
        type="button"
        title="Alle sichtbaren Zeilen als Text kopieren"
      >
        <svg
          viewBox="0 0 16 16"
          width="14"
          height="14"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5.5" y="5.5" width="8" height="9" rx="1.5" />
          <path d="M10.5 5.5v-3a1.5 1.5 0 0 0-1.5-1.5H4a1.5 1.5 0 0 0-1.5 1.5v7A1.5 1.5 0 0 0 4 11h1.5" />
        </svg>
        Kopieren
      </button>
      <button id="logClearBtn" class="btn btn-danger" type="button">
        <svg
          viewBox="0 0 16 16"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <polyline points="2.5,4 13.5,4" />
          <path d="M5.5 4V2.5h5V4" />
          <path d="M3.5 4l.7 9.2a1.3 1.3 0 0 0 1.3 1.3h5a1.3 1.3 0 0 0 1.3-1.3L12.5 4" />
          <line x1="6.5" y1="6.5" x2="6.5" y2="12" />
          <line x1="9.5" y1="6.5" x2="9.5" y2="12" /></svg
        >Leeren
      </button>
    </div>
  </div>
  <div id="logOutput" class="log-output"></div>
</section>
