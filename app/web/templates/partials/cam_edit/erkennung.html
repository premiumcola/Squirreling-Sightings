<div class="cam-tab-panel" id="cam-tab-erkennung">
  <!-- Status strip: dot variant + ms/Frame + last-update relative.
                   Hydrated by _updateErkStatusStrip from the camera's runtime
                   status (detection_mode, coral_available, inference_avg_ms,
                   frame_age_s). -->
  <div id="camGlobalStatus" class="erk-status">
    <span class="dot is-ok"></span>
    <span class="lbl" id="erkStatusText">Coral läuft</span>
    <span class="val" id="erkStatusMs">— ms / Frame</span>
    <span class="sep"></span>
    <span class="lbl">letztes Update</span>
    <span class="val" id="erkStatusUpdated">—</span>
  </div>

  <div class="erk-flow">
    <!-- D9 · Klassenfilter is the only control left on this tab. Confidence
         (D1-D4) and every camera-wide loop setting (D8 — scan interval,
         motion pre-trigger, tracking, ROI) both moved into the Erkennungsprofil —
         see netz/index.js + netz/_tuning.js. This tab decides WHAT gets
         looked for; the Erkennungsprofil decides how sensitively and how the loop
         runs. Two tabs asking the same question was the actual complaint. -->
    <div class="erk-step">
      <div class="erk-step-num">1</div>
      <div class="erk-step-head">
        <svg
          class="erk-step-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        <span class="erk-step-title">Was suchen?</span>
        <span class="erk-step-hint">Klassen-Filter</span>
      </div>
      <div class="erk-card">
        <div id="camObjectFilter" class="cam-objfilter-bar"></div>
      </div>
      <div class="erk-card erk-netz-card">
        <span class="lbl"
          >Empfindlichkeit, Scan-Tempo, Tracking und Kleintier-ROI sitzen im Erkennungsprofil — kamera-weit,
          nicht hier.</span
        >
        <a class="btn btn-action erk-netz-link" href="#netz">Erkennungsprofil öffnen</a>
      </div>
    </div>
  </div>
</div>
