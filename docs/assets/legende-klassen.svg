<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Die elf Klassen, die Squirreling unterscheidet: Vogel, Eichhörnchen, Katze, Hund, Fuchs, Igel, Reh, Marder, Person, Auto, Bewegung">
