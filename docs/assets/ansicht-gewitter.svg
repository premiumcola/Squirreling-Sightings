      <text x="114" y="36" fill="#edf4fb" font-size="15" font-weight="700">Gewitter zieht auf</text>
      <text x="114" y="58" fill="#9ba3ad" font-size="12">14. Mai · 15:02 · 41 min · Zeitraffer</text>
      <rect x="520" y="38" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="520" y="38" width="132" height="7" rx="3.5" fill="#7a8eb5"/>
      <text x="848" y="46" fill="#b4bed4" font-size="13" font-weight="700">60 min gerafft</text>
