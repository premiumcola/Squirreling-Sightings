services:
  squirreling-sightings:
    build:
      context: ./app
      dockerfile: docker/Dockerfile
      cache_from:
        - squirreling-sightings:latest
      args:
        BUILD_COMMIT: ${BUILD_COMMIT:-dev}
        BUILD_DATE: ${BUILD_DATE:-unknown}
        BUILD_COUNT: ${BUILD_COUNT:-0}
    image: squirreling-sightings
    container_name: squirreling-sightings
    restart: unless-stopped
    ports:
      - "8099:8099"
    # P29 · production base — only DATA mounts, no code mounts. The
    # built image holds the canonical app/web. Local development adds
    # the code mounts back via docker-compose.override.yml which
    # docker-compose merges automatically when present.
    #
    # Storage carries user data (event JSONs, mp4s, settings.json);
    # models holds the .tflite files that ship out-of-band; app/config
    # is the bundled config.yaml that's read-only at runtime but lives
    # outside the image so an operator can edit it without rebuilding.
    volumes:
      - ./app/config:/app/config
      - ./storage:/app/storage
      - ./models:/app/models
    # Pass every USB device through so the Coral Edge TPU is visible inside
    # the container. Harmless when no Coral stick is plugged in.
    devices:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      - TZ=Europe/Berlin
      # Force RTSP-over-TCP for every cv2.VideoCapture handle in the
      # process. Without this, FFmpeg defaults to UDP, drops packets,
      # and decodes the gap into the bottom-strip / macroblock smear
      # corruption that the new bottom_strip_anomaly validator was
      # built around. The 5 s `timeout` matches RTSP_TIMEOUT_US in
      # app/rtsp_options.py so the boot-time setting agrees with the
      # per-handle runtime override. Spelled `timeout`, not `stimeout` —
      # FFmpeg 7 removed the latter and drops unknown keys silently,
      # which left every handle with no socket timeout at all. Format
      # follows OpenCV's FFmpeg-options grammar (key;value pairs
      # joined by `|`).
      - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|timeout;5000000
      # V81 · pass through host-side FLAP_DIAG so the per-failure
      # diagnostic + parallel network probe in camera_runtime fire
      # only when the operator explicitly enables them
      # (FLAP_DIAG=1 docker compose up -d). Empty when unset → the
      # `os.getenv("FLAP_DIAG")` check returns "" and short-circuits.
      - FLAP_DIAG=${FLAP_DIAG:-}
      # Xeno-canto API key for the bird-song fetch. From 2025-10-10 the
      # v3 API refuses every request without one, and the fetcher then
      # writes an empty recordings list — which is exactly why no
      # species dossier ever showed a play button. Passed THROUGH from
      # the host, never written here: this file is tracked in a public
      # repo (CLAUDE.md hard rule 3). Get a key from a xeno-canto
      # account and put it in the host's `.env` beside this file, or
      # export it before `docker compose up -d`. Empty when unset — the
      # app then logs one WARNING per boot naming this variable and the
      # dossier says "noch nicht geladen" instead of showing nothing.
      - XENO_CANTO_API_KEY=${XENO_CANTO_API_KEY:-}

  # Coral TPU variant — Python 3.9 + pycoral 2.0, the stack Google tests
  # against libedgetpu. Use INSTEAD OF the service above (both claim
  # container_name and port 8099, so exactly one may be active).
  #
  # No build: key — the server never builds. The image comes from ghcr,
  # published by the build-push-coral job in .github/workflows/build.yml.
  # Full switch-over and rollback procedure: docs/coral-tpu-image.md
  #
  # squirreling-sightings-coral:
  #   image: ghcr.io/premiumcola/squirreling-sightings:coral
  #   container_name: squirreling-sightings
  #   restart: unless-stopped
  #   ports:
  #     - "8099:8099"
  #   volumes:
  #     - ./app/config:/app/config
  #     - ./storage:/app/storage
  #     - ./models:/app/models
  #   devices:
  #     - /dev/bus/usb:/dev/bus/usb
  #   environment:
  #     - TZ=Europe/Berlin
  #     - OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|timeout;5000000
  #     - FLAP_DIAG=${FLAP_DIAG:-}
