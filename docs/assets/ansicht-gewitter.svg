        <g transform="translate(10,5)" fill="none" stroke="#9ba3ad" stroke-width="1.6" stroke-linejoin="round"><rect x="0" y="1" width="15" height="12" rx="2"/><path d="M0 5h15M4 1v12M11 1v12"/></g>
        <text x="34" y="17" fill="#9ba3ad" font-size="12" font-weight="700">1 Clip</text>
