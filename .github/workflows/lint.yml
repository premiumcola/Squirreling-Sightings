# Linting CI — runs ruff + mypy + eslint + prettier on every push +
# pull_request. Independent from the Docker image build (build.yml) so
# image publishing isn't blocked by lint failures while the codebase
# tightens. The build.yml flow is the gate that determines what ships;
# this file is the early-warning system.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime + dev requirements
        run: |
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: pytest
        working-directory: app
        run: pytest tests/ -q

  py39:
    # The Coral image runs Python 3.9 (pycoral publishes no wheel above
    # it), so one tree has to serve two interpreters. test_py39_compat.py
    # guards this by scanning the AST — but it runs UNDER 3.11, so it is
    # a proxy, not the thing itself. This job is the thing itself: a real
    # 3.9 interpreter compiling every module.
    #
    # Cheap on purpose. compileall catches syntax and grammar, which is
    # the class of breakage that would otherwise surface as a container
    # restart-loop on the operator's box with no local reproduction.
    # It cannot catch a runtime-only break (a 3.11-only stdlib argument
    # on a code path nobody imports at compile time) — the AST guard
    # covers the known names there, and the image's own build-time import
    # smoke covers the rest.
    name: Python 3.9 floor (Coral image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Compile every module on 3.9
        run: python -m compileall -q app/app app/scripts

  python:
    name: Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dev requirements
        run: pip install -r app/requirements-dev.txt

      - name: ruff check (key families blocking)
        # P27 · post-M06 the baseline is clean for the F/E9/B904/B905/F401
        # families — gate on these. Other families (E402 late imports,
        # E741 single-letter `l` etc.) stay non-blocking for now via
        # the explicit --select list.
        run: ruff check app/ --select F,E9,B904,B905,F401

      - name: ruff format check (warning-only baseline)
        # Codebase was mass-formatted in M04. Still non-blocking for the
        # rare partial-format diff that might slip through pre-commit.
        run: ruff format --check app/ || true

      - name: mypy (permissive baseline)
        # Permissive mode — currently a warning-collector, not a
        # blocker. The `|| true` lets the job pass even with warnings;
        # remove once the codebase's type coverage is dense enough to
        # hold a green baseline.
        run: mypy app/app/ || true

  javascript:
    name: JavaScript (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: eslint
        # P27 · errors block, warnings allowed up to the same 50 ratchet
        # pre-commit enforces locally.
        run: npx eslint app/web/static/js --max-warnings 50
        # Prettier check intentionally skipped in this round — the
        # codebase predates prettier and a mass --write would rewrite
        # ~48 files at once. Prettier runs in pre-commit on edited files
        # and gets enabled in CI once the CSS-split prompt normalises
        # the style as part of its partials work.

  javascript-tests:
    # The frontend's unit tests live in `_tests/` folders next to the
    # code they cover and run on node's own built-in test runner. Until
    # this job existed they gated NOTHING: 25+ test files, green only on
    # whichever machine last bothered to run them by hand. Every "proved
    # by a node test" claim in a review was an unenforced local promise.
    #
    # No `npm install` step on purpose. These tests import node builtins
    # (node:test, node:assert) plus relative paths into app/web/static/js
    # and nothing else — there is no bundler and no test framework to
    # install. Skipping the install keeps the job independent of the
    # registry, and `npm ci` is not an option regardless: this repo
    # tracks no package-lock.json.
    #
    # The file list comes from `find`, not from a glob passed to node.
    # `node --test <dir>` searches a directory on node 20 but treats it
    # as a module path on node 24, while glob expansion of the positional
    # argument only arrived in node 22 — so no single positional form
    # works across the versions developers and CI actually run. An
    # explicit file list behaves identically on all of them.
    name: JavaScript (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: node --test
        run: npm test
