    </g>

    <!-- Zeile 5 -->
    <g transform="translate(28,520)">
      <rect width="1144" height="84" rx="14" fill="#1a1a1a"/>
      <circle cx="42" cy="42" r="18" fill="#ffffff" fill-opacity="0.06"/>
      <text x="42" y="48" fill="#7b848e" font-size="16" font-weight="800" text-anchor="middle">5</text>
      <g transform="translate(78,30) scale(0.92)" fill="none" stroke="#6d7787" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h16M3 12h18M5 16h14M7 20h10"/></g>
      <text x="114" y="36" fill="#edf4fb" font-size="15" font-weight="700">Bodennebel bis in den Vormittag</text>
      <text x="114" y="58" fill="#9ba3ad" font-size="12">29. Oktober · 05:38 · 3 h 12 min</text>
      <rect x="520" y="38" width="300" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.08"/>
