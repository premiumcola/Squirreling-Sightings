<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Das Gewitter-Archiv: eine nach Stärke sortierte Liste vergangener Unwetter mit Rang, Dauer, Stärkebalken, Spitzenwert und der Zahl der aufgezeichneten Clips.">
  <!-- Die Symbole und Farben der Filterzeile kommen aus
       core/weather-types.js (WEATHER_TYPES) — dieselbe Tabelle, aus der
       auch Telegram und MQTT ihre Labels ziehen. Das Archiv füllt sich
       von allein: überschreiten Blitzpotential, Niederschlag oder Böen
       die Schwelle, legt der Wetterdienst eine Episode an und schneidet
       mit. -->
  <rect width="1200" height="620" rx="18" fill="#141414"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
    <!-- Kopf -->
    <g transform="translate(28,22)" fill="none" stroke="#7faec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 2L3 14h7l-1 8 11-14h-7l0-6z"/>
    </g>
    <text x="60" y="42" fill="#edf4fb" font-size="22" font-weight="800">Gewitter-Archiv</text>
    <text x="60" y="66" fill="#9ba3ad" font-size="13">2026 · 14 Gewitter · 3 h 52 min Aufzeichnung · stärkstes am 11. Juli</text>

    <!-- Jahres- und Sortierpillen + Vergleichsknopf -->
    <g font-size="12.5" font-weight="700">
      <g transform="translate(742,26)">
        <rect width="62" height="32" rx="12" fill="#3b82f6" fill-opacity="0.22"/><text x="31" y="21" fill="#bfdbfe" text-anchor="middle">2026</text>
        <rect x="70" y="0" width="62" height="32" rx="12" fill="#222222"/><text x="101" y="21" fill="#9ba3ad" text-anchor="middle">2025</text>
      </g>
      <g transform="translate(890,26)">
        <rect width="80" height="32" rx="12" fill="#222222"/><text x="40" y="21" fill="#9ba3ad" text-anchor="middle">Neueste</text>
        <rect x="88" y="0" width="80" height="32" rx="12" fill="#3b82f6" fill-opacity="0.22"/><text x="128" y="21" fill="#bfdbfe" text-anchor="middle">Stärkste</text>
      </g>
      <g transform="translate(1068,26)">
        <rect width="104" height="32" rx="12" fill="#2a3b46"/><text x="52" y="21" fill="#cfe3ee" text-anchor="middle">Vergleichen</text>
      </g>
    </g>

    <!-- Filterzeile nach Wetterart -->
    <g font-size="12.5" font-weight="700">
      <g transform="translate(28,86)">
        <rect width="124" height="34" rx="12" fill="#7faec9" fill-opacity="0.18"/>
        <g transform="translate(12,8) scale(0.78)" fill="none" stroke="#7faec9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 11-14h-7l0-6z"/></g>
        <text x="40" y="22" fill="#bcd8e8">Gewitter 14</text>
      </g>
      <g transform="translate(160,86)">
        <rect width="134" height="34" rx="12" fill="#5a8aa8" fill-opacity="0.18"/>
        <g transform="translate(12,8) scale(0.78)" fill="none" stroke="#5a8aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 13a5 5 0 0 0 0-10 7 7 0 0 0-13.5 2.5"/><path d="M7 17l-2 4"/><path d="M11 19l-1 2"/><path d="M14 17l-2 4"/></g>
        <text x="40" y="22" fill="#a8c4d6">Starkregen 9</text>
